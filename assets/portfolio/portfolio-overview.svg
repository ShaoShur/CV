    <text x="490" y="106" fill="#747a72" font-size="9">03 / ANALYSIS MAP</text>
    <g fill="#b6f23c">
      <circle cx="522" cy="162" r="5"/><circle cx="574" cy="135" r="8"/><circle cx="626" cy="169" r="6"/><circle cx="690" cy="126" r="10"/><circle cx="724" cy="177" r="4"/>
