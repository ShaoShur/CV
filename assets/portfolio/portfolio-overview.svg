      <stop stop-color="#b6f23c" stop-opacity=".16"/>
      <stop offset="1" stop-color="#b6f23c" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="440" fill="#0b0d0c"/>
  <rect width="800" height="440" fill="url(#grid)"/>
  <circle cx="680" cy="40" r="250" fill="url(#glow)"/>
  <g font-family="IBM Plex Mono,Consolas,monospace">
    <text x="32" y="34" fill="#777d75" font-size="10" letter-spacing="1.6">QLIK / PROJECT SYSTEM</text>
